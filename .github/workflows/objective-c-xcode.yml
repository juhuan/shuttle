name: Build, Test and Release

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build, test and package
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run unit tests
        run: |
          xcodebuild test \
            -project Shuttle.xcodeproj \
            -scheme Shuttle \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

      - name: Build unsigned Release (non-tag)
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: |
          xcodebuild \
            -project Shuttle.xcodeproj \
            -scheme Shuttle \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package and upload unsigned DMG (non-tag)
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: |
          APP_PATH="build/Build/Products/Release/Shuttle.app"
          DMG_TEMP="$RUNNER_TEMP/shuttle-dmg"
          rm -rf "$DMG_TEMP"
          mkdir -p "$DMG_TEMP"
          cp -R "$APP_PATH" "$DMG_TEMP/"
          ln -s /Applications "$DMG_TEMP/Applications"
          hdiutil create -volname Shuttle -srcfolder "$DMG_TEMP" -ov -format UDZO Shuttle.dmg

      - name: Upload unsigned DMG artifact (non-tag)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: Shuttle-unsigned.dmg
          path: Shuttle.dmg

      - name: Import Developer ID certificate
        if: startsWith(github.ref, 'refs/tags/')
        env:
          CERTIFICATE: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$CERTIFICATE" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Build and sign Release (tag)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          IDENTITY: ${{ secrets.APPLE_DEVELOPER_IDENTITY }}
          KEYCHAIN_PATH: $RUNNER_TEMP/app-signing.keychain-db
        run: |
          xcodebuild \
            -project Shuttle.xcodeproj \
            -scheme Shuttle \
            -configuration Release \
            -derivedDataPath build \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            CODE_SIGN_IDENTITY="$IDENTITY" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH" \
            build
          APP_PATH="build/Build/Products/Release/Shuttle.app"
          /usr/bin/ditto -c -k --keepParent "$APP_PATH" "$RUNNER_TEMP/Shuttle.zip"

      - name: Notarize (tag)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          APPLE_NOTARY_USER: ${{ secrets.APPLE_NOTARY_USER }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit "$RUNNER_TEMP/Shuttle.zip" \
            --apple-id "$APPLE_NOTARY_USER" \
            --password "$APPLE_NOTARY_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

      - name: Staple and package DMG (tag)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          APP_PATH="build/Build/Products/Release/Shuttle.app"
          xcrun stapler staple "$APP_PATH"
          DMG_TEMP="$RUNNER_TEMP/shuttle-dmg"
          rm -rf "$DMG_TEMP"
          mkdir -p "$DMG_TEMP"
          cp -R "$APP_PATH" "$DMG_TEMP/"
          ln -s /Applications "$DMG_TEMP/Applications"
          hdiutil create -volname Shuttle -srcfolder "$DMG_TEMP" -ov -format UDZO Shuttle.dmg

      - name: Publish DMG to GitHub Release (tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Shuttle.dmg
          generate_release_notes: true